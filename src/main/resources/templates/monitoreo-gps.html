<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1633">
<title>Monitoreo · Transportes CHC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
	href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/monitoreo-gps.css">
</head>
<body>
	<header class="top">
		<div class="brand">
			<span class="logo" aria-hidden="true">&#9951;</span>Transportes CHC
		</div>
		<nav id="tabs" aria-label="Secciones">
			<button type="button" data-t="mon" class="on">Monitoreo</button>
			<button type="button" data-t="viajes">Viajes</button>
			<button type="button" data-t="puntos">Puntos</button>
		</nav>
		<!-- CAMBIA EL href por la ruta real de tu dashboard (por ejemplo "/" o "/inicio") -->
		<a class="btn back" href="/dashboard" title="Volver al dashboard">&larr;
			Dashboard</a> <span id="estado" class="estado" role="status">Conectando…</span>
	</header>

	<section class="hero">
		<div>
			<div class="crumb">
				<a href="/dashboard" style="color: inherit; text-decoration: none">Dashboard</a>
				&rsaquo; <b id="crumb">Monitoreo</b>
			</div>
			<h1>Centro de monitoreo</h1>
			<p>Ubicación de unidades, viajes programados y paradas en tiempo
				real.</p>
		</div>
		<div class="acciones">
			<button type="button" class="btn ghost" id="nuevoPunto">+
				Nuevo punto</button>
			<button type="button" class="btn amber" id="nuevoViaje">+
				Nuevo viaje</button>
		</div>
	</section>

	<section class="kpis" id="kpis" aria-label="Resumen"></section>

	<main class="work">
		<aside class="panel" id="panel"></aside>
		<div id="map"></div>
	</main>

	<dialog id="dv">
	<form id="fv" method="dialog">
		<h2>Programar viaje</h2>
		<label for="vid">ID del viaje (opcional)</label><input id="vid"
			type="number" min="1" placeholder="Automático si lo dejas vacío">
		<label for="vcam">Unidad</label><select id="vcam" required></select>
		<div class="row">
			<div>
				<label for="vori">Origen</label><select id="vori" required></select>
			</div>
			<div>
				<label for="vdes">Destino</label><select id="vdes" required></select>
			</div>
		</div>
		<label for="vfec">Salida estimada (opcional)</label><input id="vfec"
			type="datetime-local">
		<p class="aviso" id="vaviso" hidden>Primero crea un punto de
			origen y uno de destino.</p>
		<div class="pie">
			<button type="button" class="btn soft" data-close>Cancelar</button>
			<button class="btn amber">Programar</button>
		</div>
	</form>
	</dialog>

	<dialog id="dp">
	<form id="fp" method="dialog">
		<h2>Nuevo punto</h2>
		<label for="pnom">Nombre</label><input id="pnom" required
			placeholder="Ej. Bodega San Pedro Sula">
		<div class="row">
			<div>
				<label for="ptipo">Tipo</label><select id="ptipo"><option
						value="origen">Origen</option>
					<option value="destino">Destino</option></select>
			</div>
			<div>
				<label for="prad">Radio (metros)</label><input id="prad"
					type="number" min="20" max="5000" value="100">
			</div>
		</div>
		<div class="row">
			<div>
				<label for="plat">Latitud</label><input id="plat" type="number"
					step="any" required>
			</div>
			<div>
				<label for="plng">Longitud</label><input id="plng" type="number"
					step="any" required>
			</div>
		</div>
		<p class="aviso" id="paviso" hidden></p>
		<div class="pie">
			<button type="button" class="btn soft" data-close>Cancelar</button>
			<button type="button" class="btn navy" id="bpick">Marcar en
				el mapa</button>
			<button class="btn amber">Guardar</button>
		</div>
	</form>
	</dialog>

	<!-- Modal de confirmación (eliminar, finalizar, guardar cambios, descartar) -->
	<dialog id="dc">
	<h2 id="dctit">Confirmar</h2>
	<p class="msg" id="dctxt"></p>
	<div class="pie">
		<button type="button" class="btn soft" id="dcno">Cancelar</button>
		<button type="button" class="btn amber" id="dcsi">Aceptar</button>
	</div>
	</dialog>

	<div id="pickbar" hidden>
		Haz clic en el mapa donde está el punto &middot; <u id="pickcancel">cancelar</u>
	</div>

	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
	<script src="js/monitoreo-gps.js"></script>
</body>
</html>
