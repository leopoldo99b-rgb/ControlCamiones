<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8" />

<title>Reporte Gráfico</title>

<style>
* {
	box-sizing: border-box;
	font-family: Arial, Helvetica, sans-serif;
}

body {
	font-size: 12px;
	color: #222;
	margin: 25px;
}

h1, h2, h3, h4 {
	margin: 0;
}

.header {
	border-bottom: 3px solid #0d6efd;
	padding-bottom: 12px;
	margin-bottom: 20px;
}

.empresa {
	font-size: 24px;
	font-weight: bold;
	color: #0d6efd;
}

.titulo {
	font-size: 20px;
	margin-top: 5px;
}

.fecha {
	float: right;
	text-align: right;
	font-size: 11px;
	color: #666;
}

.info {
	width: 100%;
	border-collapse: collapse;
	margin-bottom: 20px;
}

.info td {
	padding: 8px;
}

.cards {
	width: 100%;
	border-collapse: separate;
	border-spacing: 10px;
	margin-bottom: 25px;
}

.card {
	border: 1px solid #d9d9d9;
	background: #f8f9fa;
	text-align: center;
	padding: 15px;
}

.card span {
	display: block;
	font-size: 11px;
	color: #666;
}

.card h2 {
	margin-top: 8px;
	color: #0d6efd;
}

.grafico {
	border: 1px solid #ccc;
	padding: 15px;
	margin-bottom: 25px;
	text-align: center;
}

.grafico img {
	width: 100%;
	max-width: 900px;
	height: auto;
}

table {
	width: 100%;
	border-collapse: collapse;
}

th {
	background: #0d6efd;
	color: white;
	padding: 8px;
}

td {
	border: 1px solid #ddd;
	padding: 7px;
}

tr:nth-child(even) {
	background: #f8f8f8;
}

.footer {
	margin-top: 25px;
	border-top: 1px solid #ccc;
	padding-top: 10px;
	font-size: 10px;
	color: #777;
	text-align: center;
}
</style>

</head>


<body>


	<div class="header">


		<div class="fecha">

			Fecha de emisión <br /> <span th:text="${fechaImpresion}"></span>

		</div>


		<div class="empresa">CONTROL DE CAMIONES</div>


		<div class="titulo">REPORTE GRÁFICO DE MANTENIMIENTOS</div>


	</div>



	<table class="info">

		<tr>

			<td><b>Reporte:</b> <span th:text="${reporte.titulo}"></span></td>


			<td><b>Fecha inicio:</b> <span
				th:text="${reporte.inicio != null ? reporte.inicio : '-'}"></span></td>


			<td><b>Fecha fin:</b> <span
				th:text="${reporte.fin != null ? reporte.fin : '-'}"></span></td>


		</tr>

	</table>




	<table class="cards">

		<tr>


			<td class="card"><span>Total mantenimientos</span>

				<h2 th:text="${reporte.dashboard.totalMantenimientos}"></h2></td>



			<td class="card"><span>Gasto total</span>

				<h2
					th:text="${#numbers.formatDecimal(reporte.dashboard.costoTotal,1,'COMMA',2,'POINT')}"></h2>

			</td>



			<td class="card"><span>Próximos</span>

				<h2 th:text="${reporte.dashboard.proximos}"></h2></td>



			<td class="card"><span>Vencidos</span>

				<h2 th:text="${reporte.dashboard.vencidos}"></h2></td>


		</tr>

	</table>




	<div class="grafico">


		<h3>Gráfico generado</h3>


		<br /> <img th:if="${imagenGrafico != null}" th:src="${imagenGrafico}"
			alt="Grafico" />


	</div>





	<h3>Detalle de la información</h3>


	<br />




	<table>


		<thead>


			<tr>

				<th>Etiqueta</th>

				<th>Valor</th>

			</tr>


		</thead>



		<tbody>


			<tr th:each="dato : ${reporte.datos}">


				<td th:text="${dato.etiqueta}"></td>


				<td th:text="${dato.valor}"></td>


			</tr>


		</tbody>


	</table>




	<div class="footer">Documento generado automáticamente por el
		Sistema de Control de Camiones.</div>



</body>

</html>
